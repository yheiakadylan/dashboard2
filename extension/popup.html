<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      /* Slate 900 */
      --primary-hover: #334155;
      /* Slate 700 */
      --bg: #f8fafc;
      /* Slate 50 */
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      /* Slate 200 */
      --ring: #cbd5e1;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: var(--card);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .app-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .app-title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    /* Content */
    .content {
      padding: 16px 20px 24px;
      display: none;
    }

    .content.active {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .val {
      font-weight: 600;
      font-size: 13px;
    }

    /* Form Elements */
    .input-group {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="time"],
    input[type="date"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.1);
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .btn-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #ef4444;
    }

    .btn-danger:hover {
      background: #fee2e2;
    }

    /* Shops List */
    .shop-list {
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      background: var(--card);
    }

    .shop-list::-webkit-scrollbar {
      width: 6px;
    }

    .shop-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .shop-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .shop-item:hover {
      background: #f1f5f9;
    }

    .shop-item input[type="checkbox"] {
      margin-right: 10px;
      cursor: pointer;
      width: auto;
    }

    /* Status Badge */
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: #ecfdf5;
      color: #059669;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #a7f3d0;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
    }

    .status-badge.inactive {
      background: #f1f5f9;
      color: var(--text-muted);
      border-color: #e2e8f0;
    }

    /* Radio Group */
    .radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Utilities */
    .mt-4 {
      margin-top: 16px;
    }

    .mb-4 {
      margin-bottom: 16px;
    }

    .text-center {
      text-align: center;
    }

    .flex-row {
      display: flex;
      gap: 8px;
    }

    .flex-1 {
      flex: 1;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="app-icon">
      <img src="icon.jpg" alt="Icon">
    </div>
    <div class="app-title">Dashboard Config</div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" style="padding: 24px 20px;">
    <div class="text-center mb-4">
      <h3 style="font-size:18px; font-weight:600;">Welcome Back</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">Sign in to your dashboard account</p>
    </div>

    <div class="input-group">
      <label class="input-label">Email</label>
      <input type="text" id="loginEmail" placeholder="your@email.com">
    </div>
    <div class="input-group">
      <label class="input-label">Password</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <div class="input-group" style="display: none;">
      <label class="input-label">App URL (Optional)</label>
      <input type="text" id="loginAppUrl" value="https://dashboardvikcom.vercel.app">
    </div>

    <button id="loginBtn" class="btn-primary mt-4">Sign In</button>
    <div id="loginError" style="color:#ef4444; font-size:12px; margin-top:12px; text-align:center;"></div>
  </div>

  <!-- MAIN APP (Hidden by default) -->
  <div id="main-app" style="display:none;">
    <div class="tabs">
      <div class="tab active" data-tab="status">Status & Controls</div>
      <div class="tab" data-tab="settings">Config</div>
    </div>

    <!-- STATUS TAB -->
    <div id="status" class="content active">

      <div class="section-title">Overview</div>
      <div class="card">
        <div class="row">
          <span class="label">Service</span>
          <div class="status-badge" id="serviceStatus">
            <div class="dot"></div> <span id="statusText">Active</span>
          </div>
        </div>
        <div class="row">
          <span class="label">Last Sync</span>
          <span class="val" id="lastRun">Never</span>
        </div>
        <div class="row">
          <span class="label">Next Sync</span>
          <span class="val" id="nextRun">--:--</span>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <span class="label">Active Shops</span>
          <span class="val" id="totalShops">0</span>
        </div>
        <div class="row">
          <span class="label">Total Listings</span>
          <span class="val" id="totalListings">0</span>
        </div>
      </div>

      <div class="mt-4">
        <button class="btn-primary" id="runNowBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Run Crawl Now
        </button>
        <button class="btn-danger" id="stopCrawlBtn" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          Stop Crawl
        </button>
      </div>

      <hr>

      <div class="section-title">Manual Data Sync</div>
      <button id="forceSnapshotBtn" class="btn-outline mb-4">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Snapshot (Yesterday)
      </button>

      <div class="card" style="background:var(--bg); border:1px solid var(--border); box-shadow:none;">
        <div style="font-size:12px; font-weight:600; margin-bottom:10px;">Backfill Snapshots</div>
        <div class="flex-row">
          <div class="flex-1">
            <label class="input-label" style="font-size:11px;">From</label>
            <input type="date" id="backfillStart" style="padding:6px; font-size:12px;">
          </div>
          <div class="flex-1">
            <label class="input-label" style="font-size:11px;">To</label>
            <input type="date" id="backfillEnd" style="padding:6px; font-size:12px;">
          </div>
        </div>
        <button id="runBackfillBtn" class="btn-primary" style="margin-top:12px; padding:8px;">Execute Backfill</button>
        <div id="backfillMsg" style="text-align:center; font-size:11px; margin-top:8px; display:none; font-weight:500;">
        </div>
      </div>

    </div>

    <!-- SETTINGS TAB -->
    <div id="settings" class="content">

      <div style="display: none;">
        <div class="section-title">Connectivity</div>
        <div class="input-group">
          <label class="input-label">App URL</label>
          <input type="text" id="appUrl" placeholder="https://..." value="https://dashboardvikcom.vercel.app">
        </div>

        <div class="input-group">
          <label class="input-label">Team ID</label>
          <input type="text" id="teamId" placeholder="Team ID" value="jwnm5emo8mdG3gjIlh7CctiVvQO2">
        </div>

        <hr>
      </div>

      <div class="section-title" style="justify-content: space-between;">
        Shops Target
        <button id="fetchShopsBtn" class="btn-outline"
          style="width:auto; padding:4px 10px; font-size:11px; margin:0;">Refresh</button>
      </div>

      <div class="input-group">
        <div class="shop-list" id="shopListContainer">
          <div style="padding:16px; color:var(--text-muted); text-align:center; font-size:12px;">No shops loaded</div>
        </div>
      </div>

      <hr>

      <div class="section-title" style="justify-content: space-between;">
        Auto-Crawl Schedule
        <label style="display:flex; align-items:center; cursor:pointer; font-weight:normal; font-size:12px;">
          <input type="checkbox" id="autoCrawlEnable" checked
            style="margin-right:6px; width:auto; accent-color:var(--primary);"> Enable
        </label>
      </div>

      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="crawlMode" value="interval" checked style="accent-color:var(--primary);"> Interval
        </label>
        <label class="radio-label">
          <input type="radio" name="crawlMode" value="daily" style="accent-color:var(--primary);"> Fixed Time
        </label>
      </div>

      <div class="input-group" id="groupInterval">
        <label class="input-label">Interval (Hours)</label>
        <input type="number" id="intervalHours" value="6" min="1">
      </div>

      <div class="input-group" id="groupDaily" style="display:none;">
        <label class="input-label">Run at Time</label>
        <input type="time" id="dailyTime" value="06:00">
      </div>

      <div class="mt-4 pt-4" style="border-top:1px solid var(--border);">
        <button id="saveConfigBtn" class="btn-primary">Save Configuration</button>
        <div id="saveMsg"
          style="text-align:center; font-size:12px; color:#059669; margin-top:10px; opacity:0; transition:0.3s; font-weight:500;">
          Settings Saved!</div>
      </div>

      <button class="btn-outline mt-4" id="logoutBtn" style="color:#ef4444; border-color:#fecaca;">Logout from
        Extension</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
