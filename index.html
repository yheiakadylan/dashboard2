<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 4V20H8V4H4ZM10 10V20H14V10H10ZM16 16V20H20V16H16Z" fill="%234299e1"/><path d="M4 15L9 9L14 13L20 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'gray-900': '#111827', // Darker base
              'gray-800': '#1f2937', // Card bg
              'gray-700': '#374151', // Border/Input
              'gray-600': '#4b5563',
              'gray-500': '#6b7280',
              'blue-500': '#3b82f6',
              'blue-600': '#2563eb',
            },
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Theme Defaults */
        --spinner-border-color: rgba(0, 0, 0, 0.1);
        --spinner-top-color: #3182ce;
        --recharts-grid-stroke: #e2e8f0;
        --recharts-text-color: #64748b;
        --recharts-tooltip-bg: #ffffff;
        --recharts-tooltip-border: #e2e8f0;
        --recharts-tooltip-label-color: #1e293b;
      }
      html.dark {
        /* Dark Theme Overrides - High Contrast */
        --spinner-border-color: rgba(255, 255, 255, 0.2);
        --spinner-top-color: #60a5fa;
        --recharts-grid-stroke: #374151; /* Gray 700 */
        --recharts-text-color: #9ca3af; /* Gray 400 */
        --recharts-tooltip-bg: #1f2937; /* Gray 800 */
        --recharts-tooltip-border: #4b5563; /* Gray 600 */
        --recharts-tooltip-label-color: #f3f4f6; /* Gray 100 */
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #4b5563; 
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; 
      }

      #root:empty::before {
        content: '';
        display: block;
        border: 4px solid var(--spinner-border-color);
        border-radius: 50%;
        border-top: 4px solid var(--spinner-top-color);
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -20px;
        margin-left: -20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/",
    "firebase/app": "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js",
    "@babel/core/": "https://aistudiocdn.com/@babel/core@^7.28.5/",
    "@vercel/node": "https://aistudiocdn.com/@vercel/node@^5.5.3",
    "firebase-admin/": "https://aistudiocdn.com/firebase-admin@^13.5.0/",
    "recharts": "https://aistudiocdn.com/recharts@^2.12.7",
    "buffer": "https://aistudiocdn.com/buffer@^6.0.3",
    "crypto": "https://aistudiocdn.com/crypto@^1.0.1",
    "node-fetch": "https://aistudiocdn.com/node-fetch@^3.3.2",
    "react-window": "https://esm.sh/react-window@1.8.10?external=react,react-dom",
    "react-virtualized-auto-sizer": "https://esm.sh/react-virtualized-auto-sizer@1.0.24?external=react,react-dom",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite-plugin-pwa": "https://aistudiocdn.com/vite-plugin-pwa@^1.2.0"
  }
}
</script>
</head>
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
