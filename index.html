<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/nh-logo-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard — Hệ thống vận hành, báo cáo và quản trị hiệu suất." />
  <meta name="theme-color" content="#159AD6" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com">
  <link rel="preconnect" href="https://wsrv.nl">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Dashboard</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'light';
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --loader-bg: #F4F6F8;
      --loader-bar-bg: rgba(79, 70, 229, 0.15);
      --loader-bar-fill: #159AD6;
    }

    html.dark {
      --loader-bg: #141414;
      --loader-bar-bg: rgba(255, 255, 255, 0.1);
      --loader-bar-fill: #159AD6;
    }

    body {
      margin: 0;
      background-color: var(--loader-bg);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    .app-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .logo-pulse {
      height: 50px;
      margin-bottom: 32px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(79, 70, 229, 0.2));
    }

    html.dark .logo-pulse {
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    }

    .logo-pulse img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .progress-track {
      width: 300px;
      height: 3px;
      background-color: var(--loader-bar-bg);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background-color: var(--loader-bar-fill);
      border-radius: 4px;
      animation: progressIndeterminate 1.5s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes progressIndeterminate {
      0% { left: -30%; width: 30%; }
      50% { left: 30%; width: 70%; }
      100% { left: 100%; width: 30%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-loader">
      <div class="logo-pulse">
        <img src="/nh-logo-name.png" alt="NHMedia" />
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
