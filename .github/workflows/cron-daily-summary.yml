name: Trigger Daily Summary

on:
  schedule:
    # 07:30 UTC = 14:30 (2:30 chiều) giờ Việt Nam (UTC+7)
    # Bạn có thể đổi lại giờ theo ý muốn. Lưu ý GitHub luôn dùng giờ UTC.
    - cron: '30 7 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy tay để test ngay lập tức

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Call Daily Summary API
        run: |
          curl -v --fail -X POST https://dashboardvikcom.vercel.app/api/daily-summary \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
