<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etsy SKU Worker</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; width: 320px; background-color: #f8fafc; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h3 { margin-top: 0; color: #1e293b; font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        button { width: 100%; padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; font-size: 14px; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 13px; font-weight: 500; text-align: center; min-height: 20px; border-radius: 6px; }
        .success { color: #16a34a; background: #dcfce7; padding: 8px; }
        .error { color: #dc2626; background: #fee2e2; padding: 8px; }
        .info { color: #2563eb; background: #dbeafe; padding: 8px; }
        .divider { height: 1px; background-color: #e2e8f0; margin: 24px 0; }
        .section-title { font-size: 15px; font-weight: 600; color: #334155; margin-bottom: 12px; }
        .flex-row { display: flex; gap: 8px; align-items: center; }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }
        .review-status-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 16px; background: #f8fafc; }
        .review-status-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
        .review-status-title { font-size: 12px; font-weight: 700; color: #334155; }
        .review-status-pill { border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #e2e8f0; color: #475569; }
        .review-status-pill.running { background: #dbeafe; color: #2563eb; }
        .review-status-pill.success { background: #dcfce7; color: #16a34a; }
        .review-status-pill.error { background: #fee2e2; color: #dc2626; }
        .review-status-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 11px; color: #64748b; }
        .review-status-row span:last-child { color: #1e293b; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
        .review-status-error { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #dc2626; overflow-wrap: anywhere; }
        /* Figma marketing-inspired compact popup skin */
        :root {
            --primary: #000000;
            --canvas: #ffffff;
            --ink: #000000;
            --hairline: #d8d8d8;
            --soft: #f7f7f2;
            --block-lime: #d9ff5b;
            --block-lilac: #d8c9ff;
            --block-cream: #fff2d7;
            --block-mint: #c9f4df;
            --bad: #c51f1f;
            --good: #0f8f4f;
            --pill: 999px;
            --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
        }
        html {
            width: 354px;
            max-height: 580px;
            min-height: 0;
            overflow: hidden;
        }
        body {
            width: 100%;
            max-height: 580px;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar { display: none; }
        body {
            font-family: var(--sans);
            padding: 12px;
            background: var(--canvas);
            color: var(--ink);
            font-weight: 330;
            letter-spacing: -0.12px;
        }
        .container {
            width: 100%;
            background: var(--soft);
            padding: 14px;
            border-radius: 22px;
            border: 1px solid var(--hairline);
            box-shadow: none;
        }
        h3 {
            color: var(--ink);
            font-size: 22px;
            font-weight: 540;
            line-height: 1.05;
            letter-spacing: -0.7px;
            margin-bottom: 12px;
        }
        h3 svg {
            width: 28px;
            height: 28px;
            padding: 5px;
            border-radius: 999px;
            background: var(--block-lime);
            stroke: var(--ink);
        }
        .form-group { margin-bottom: 10px; }
        .form-group[style] { margin-bottom: 12px !important; }
        label,
        .section-title,
        .review-status-title,
        .review-status-row,
        .review-status-pill {
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: 0.055em;
        }
        label {
            color: var(--ink);
            font-size: 10px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        input,
        textarea,
        select {
            width: 100%;
            padding: 8px 10px !important;
            border: 1px solid var(--hairline) !important;
            border-radius: 12px !important;
            background: var(--canvas) !important;
            color: var(--ink) !important;
            font-family: var(--sans) !important;
            font-size: 12px !important;
            font-weight: 330 !important;
            box-shadow: none !important;
        }
        textarea {
            min-height: 64px;
            resize: vertical;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08) !important;
        }
        button {
            min-height: 34px;
            padding: 7px 14px;
            background: var(--primary);
            color: #ffffff;
            border-radius: var(--pill);
            font-size: 12px;
            font-weight: 480;
            letter-spacing: -0.06px;
            box-shadow: none;
        }
        button:hover { background: #1f1f1f; }
        button:disabled { background: #888888; }
        .btn-secondary {
            background: #ffffff;
            color: var(--ink);
            border: 1px solid var(--hairline);
        }
        .btn-secondary:hover { background: var(--block-lime); }
        .status {
            margin-top: 10px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 480;
        }
        .success { color: var(--good); background: var(--block-mint); padding: 7px 9px; }
        .error { color: var(--bad); background: #ffe2df; padding: 7px 9px; }
        .info { color: var(--ink); background: var(--block-lilac); padding: 7px 9px; }
        .divider {
            height: 0;
            border-top: 1px solid var(--hairline);
            background: transparent;
            margin: 14px 0;
        }
        .section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .review-status-card {
            border: 1px solid var(--hairline);
            border-radius: 18px;
            padding: 10px;
            margin-bottom: 12px;
            background: var(--block-cream);
        }
        .review-status-head { margin-bottom: 6px; }
        .review-status-title { color: var(--ink); font-size: 10px; font-weight: 500; }
        .review-status-pill {
            border-radius: var(--pill);
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 500;
            background: #ffffff;
            color: var(--ink);
        }
        .review-status-pill.running { background: var(--block-lilac); color: var(--ink); }
        .review-status-pill.success { background: var(--block-mint); color: var(--ink); }
        .review-status-pill.error { background: #ffe2df; color: var(--ink); }
        .review-status-row {
            padding: 3px 0;
            font-size: 10px;
            color: var(--ink);
        }
        .review-status-row span:last-child {
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 540;
            letter-spacing: -0.08px;
            text-transform: none;
            min-width: 0;
            max-width: 68%;
            white-space: normal;
        }
        .review-status-error {
            border-top-color: rgba(0, 0, 0, 0.14);
            color: var(--bad);
        }
        .popup-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-bottom: 12px;
            padding: 4px;
            border: 1px solid var(--hairline);
            border-radius: var(--pill);
            background: var(--canvas);
        }
        .popup-tab {
            min-height: 30px;
            padding: 6px 8px;
            background: transparent;
            color: var(--ink);
            font-family: var(--mono);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .popup-tab:hover { background: var(--block-lime); }
        .popup-tab.active,
        .popup-tab.active:hover { background: var(--ink); color: #ffffff; }
        .popup-panel { display: none; }
        .popup-panel.active { display: block; }
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .schedule-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 30px;
            gap: 6px;
            align-items: center;
        }
        .schedule-row button {
            width: 30px;
            min-height: 30px;
            padding: 0;
            border-radius: 10px;
        }
        .schedule-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
    </style>

</head>
<body>
    <div class="container">
        <h3>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            SKU Worker
        </h3>
        <div class="popup-tabs" role="tablist" aria-label="SKU Worker sections">
            <button type="button" class="popup-tab active" data-popup-tab="connection">Connection</button>
            <button type="button" class="popup-tab" data-popup-tab="reviews">Reviews</button>
        </div>

        <section class="popup-panel active" data-popup-panel="connection">
        <div class="form-group">
            <label>Team ID:</label>
            <input type="text" id="teamId" value="jwnm5emo8mdG3gjIlh7CctiVvQO2" placeholder="VD: team_abc123">
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
            <label>Shop Email (Routing):</label>
            <input type="text" id="account" placeholder="VD: shop01@gmail.com">
        </div>
        <div class="form-group">
            <label>Tài khoản Dashboard:</label>
            <input type="email" id="dbEmail" value="haitrinh@gmail.com" placeholder="admin@domain.com">
        </div>
        <div class="form-group">
            <label>Mật khẩu Dashboard:</label>
            <input type="password" id="dbPassword" value="haidz123" placeholder="••••••••">
        </div>
        <button id="saveBtn">Save & Connect</button>
        <div class="status" id="statusMsg"></div>
        </section>

        <section class="popup-panel" data-popup-panel="reviews">
        <div class="section-title">Etsy Reviews Tools</div>

        <div class="review-status-card" id="reviewSyncStatusCard">
            <div class="review-status-head">
                <div class="review-status-title">Review Sync Status</div>
                <div class="review-status-pill" id="reviewSyncState">Idle</div>
            </div>
            <div class="review-status-row"><span>Action</span><span id="reviewSyncAction">-</span></div>
            <div class="review-status-row"><span>Last success</span><span id="reviewSyncLastSuccess">-</span></div>
            <div class="review-status-row"><span>Last result</span><span id="reviewSyncLastResult">-</span></div>
            <div class="review-status-row"><span>Next cron</span><span id="reviewSyncNextRun">-</span></div>
            <div class="review-status-error" id="reviewSyncLastError"></div>
        </div>
        
        <div class="form-group">
            <label>Cron Sync Hours (Asia/Ho_Chi_Minh):</label>
            <div class="flex-row">
                <input type="text" id="cronHours" placeholder="8, 12" style="width: 60%;">
                <button id="saveCronBtn" class="btn-secondary" style="width: 40%;">Save</button>
            </div>
            <div style="font-size: 11px; color: #64748b; margin-top: 4px;">Giờ chạy tự động hàng ngày (cách nhau dấu phẩy)</div>
        </div>

        <div class="form-group">
            <button id="crawl25Btn" class="btn-secondary">Crawl Ngay 25 Reviews Mới Nhất</button>
        </div>

        <div class="form-group">
            <label>Back-fill Reviews (Min Date):</label>
            <div class="flex-row">
                <input type="date" id="minDate" style="width: 60%;">
                <button id="backfillBtn" class="btn-secondary" style="width: 40%;">Back-fill</button>
            </div>
            <div style="font-size: 11px; color: #64748b; margin-top: 4px;">Chọn ngày tối thiểu để lấy lại review cũ</div>
        </div>

        <div class="status" id="toolStatusMsg"></div>
        </section>

    </div>

    <!-- SỬA LỖI MIME TYPE BẰNG CÁCH TRỎ ĐÚNG FILE BUID .JS -->
    <script type="module" src="popup.js"></script>
</body>
</html>
